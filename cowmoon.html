<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Responsive Layouts</title>
  <meta name="description" content="This site will serve as the hub for many sub responsive layouts">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body class="cowmoon">
  <!-- Place your site's HTML here -->
  <div class="cowmoon-scene">
    <img class="moon" src="./img/moon.png" alt="">
    <div class="cow-wrapper">
      <img class="cow" src="./img/cartoon-cow.png" alt="">
    </div>

  </div>


  <audio id="global-player"></audio>

  <div class="button-wrapper">
    <button class="hvr-pop button" onclick="playTrack('./audio/bewitched_nose.mp3')">Play Bewitched</button>
    <button class="hvr-pop button" onclick="playTrack('./audio/sonic_breathe_effect.mp3')">Play Sonic</button>
  </div>


  <script>
  function playTrack(audioUrl) {
    const player = document.getElementById('global-player');

    // Change the source URL to the new track
    player.src = audioUrl;

    // Force browser to load the new file structure and play
    player.load();
    player.play();
  }
  </script>

  <script src="js/main.js"></script>
</body>

</html>
